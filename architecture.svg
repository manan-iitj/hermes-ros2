<svg width="100%" viewBox="0 0 680 750" xmlns="http://www.w3.org/2000/svg" role="img">
<title>HERMES architecture pipeline</title>
<desc>Diagram showing the HERMES pipeline: two robots run SLAM, their maps are merged, frontiers are detected and published, a Hungarian allocator assigns frontiers to robots, and each robot navigates via Nav2 with an ORCA collision-avoidance layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="750" fill="#1e1e1e"/>

<line x1="190" y1="76" x2="330" y2="127" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="490" y1="76" x2="350" y2="127" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="186" x2="340" y2="219" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="276" x2="340" y2="309" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="366" x2="340" y2="399" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="440" x2="340" y2="469" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="526" x2="340" y2="559" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="616" x2="190" y2="647" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="616" x2="490" y2="647" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

<!-- Row 1: SLAM (gray) -->
<g>
<rect x="50" y="20" width="280" height="56" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
<text x="190" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#D3D1C7">Robot A</text>
<text x="190" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B4B2A9">SLAM - builds local map</text>
</g>
<g>
<rect x="350" y="20" width="280" height="56" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
<text x="490" y="40" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#D3D1C7">Robot B</text>
<text x="490" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B4B2A9">SLAM - builds local map</text>
</g>

<!-- Row 2: Map merging (teal) -->
<g>
<rect x="170" y="130" width="340" height="56" rx="8" fill="#04342C" stroke="#1D9E75" stroke-width="1"/>
<text x="340" y="150" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#9FE1CB">Multi-robot map merging</text>
<text x="340" y="168" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5DCAA5">m-explore-ros2</text>
</g>

<!-- Row 3: Global merged map (teal) -->
<g>
<rect x="170" y="220" width="340" height="56" rx="8" fill="#04342C" stroke="#1D9E75" stroke-width="1"/>
<text x="340" y="240" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#9FE1CB">Global merged map</text>
<text x="340" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5DCAA5">Shared occupancy grid</text>
</g>

<!-- Row 4: Frontier detection (purple) -->
<g>
<rect x="170" y="310" width="340" height="56" rx="8" fill="#26215C" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#CECBF6">Frontier detection</text>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#AFA9EC">Tuned frontier_exploration_ros2</text>
</g>

<!-- Row 5: topic pill (purple) -->
<g>
<rect x="250" y="400" width="180" height="40" rx="8" fill="#26215C" stroke="#7F77DD" stroke-width="1"/>
<text x="340" y="420" text-anchor="middle" dominant-baseline="central" font-family="monospace" font-size="13" font-weight="600" fill="#CECBF6">/frontier_list</text>
</g>

<!-- Row 6: Hungarian allocator (coral - highlight) -->
<g>
<rect x="170" y="470" width="340" height="56" rx="8" fill="#4A1B0C" stroke="#D85A30" stroke-width="1.5"/>
<text x="340" y="490" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#F5C4B3">Frontier allocator</text>
<text x="340" y="508" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#F0997B">Hungarian algorithm assignment</text>
</g>

<!-- Row 7: goals (gray) -->
<g>
<rect x="170" y="560" width="340" height="56" rx="8" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="580" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#D3D1C7">Per-robot navigation goals</text>
<text x="340" y="598" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#B4B2A9">Sent to Nav2 action servers</text>
</g>

<!-- Row 8: Nav2 + ORCA execution (pink) -->
<g>
<rect x="50" y="650" width="280" height="56" rx="8" fill="#4B1528" stroke="#D4537E" stroke-width="1"/>
<text x="190" y="670" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#F4C0D1">Robot A</text>
<text x="190" y="688" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#ED93B1">Nav2 (RPP) + ORCA layer</text>
</g>
<g>
<rect x="350" y="650" width="280" height="56" rx="8" fill="#4B1528" stroke="#D4537E" stroke-width="1"/>
<text x="490" y="670" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="600" fill="#F4C0D1">Robot B</text>
<text x="490" y="688" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#ED93B1">Nav2 (RPP) + ORCA layer</text>
</g>

</svg>

robot1: 
  amcl:
    ros__parameters:
      use_sim_time: True
      # AMCL is intentionally NOT used here -- localization comes from slam_toolbox.
      # This block is left out on purpose.

  controller_server:
    ros__parameters:
      use_sim_time: True
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: True
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.35

      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 1.0     # Controlled top speed for precise laser tracking
        lookahead_dist: 0.6            # Shorter lookahead tracks paths tightly
        min_lookahead_dist: 0.3
        max_lookahead_dist: 1.0
        use_regulated_linear_velocity_scaling: false
        regulated_linear_scaling_min_radius: 0.20 # Aggressively slows down in tight turns
        regulated_linear_scaling_min_speed: 0.50  # Keeps wheels crawling instead of stopping
        use_collision_detection: false
        max_allowed_time_to_collision_up_to_allowed_lookahead_dist: 1.5

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: True
        update_frequency: 15.0
        publish_frequency: 10.0
        # These two frames stay namespaced -- local costmap is per-robot.
        global_frame: robot1/odom
        robot_base_frame: robot1/base_link
        rolling_window: True
        width: 3
        height: 3
        origin_x: -1.5
        origin_y: -1.5
        resolution: 0.05
        robot_radius: 0.105
        plugins: ["voxel_layer", "inflation_layer"]
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.40
        voxel_layer:
          plugin: "nav2_costmap_2d::VoxelLayer"
          enabled: True
          publish_voxel_map: True
          origin_z: 0.0
          z_resolution: 0.05
          z_voxels: 16
          max_obstacle_height: 2.0
          mark_threshold: 0
          observation_sources: scan
          scan:
            topic: /robot1/scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
        always_send_full_costmap: True

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: True
        rolling_window: False
        update_frequency: 3.0
        publish_frequency: 2.0
        # This is the SHARED merged map frame -- stays unprefixed on purpose.
        global_frame: map
        robot_base_frame: robot1/base_link
        robot_radius: 0.15
        resolution: 0.05
        track_unknown_space: True
        # --- ADD THESE FOUR LINES TO PROVIDE AN INITIAL BOUNDS OVERRIDE ---
        width: 100
        height: 100
        origin_x: -50.0
        origin_y: -50.0
        plugins: ["static_layer", "obstacle_layer","peer_robot_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: True
          observation_sources: scan
          scan:
            topic: /robot1/scan
            max_obstacle_height: 2.0
            clearing: True
            marking: True
            data_type: "LaserScan"
            obstacle_max_range: 2.5
            obstacle_min_range: 0.22  # Force-ignore close cross-ray contamination
            raytrace_max_range: 3.0   # Must be larger than obstacle_max_range to clear ghosts
            raytrace_min_range: 0.0
            inf_is_valid: True      
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: True
          map_topic: '/map'
        # NEW: Explicitly track the peer robot's scan with an aggressive footprint
        peer_robot_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          observation_sources: peer_scan
          peer_scan:
            topic: /robot2/scan       # Robot 1 subscribes to Robot 2's laser data
            clearing: True
            marking: True
            data_type: "LaserScan"
            obstacle_max_range: 3.5
            raytrace_max_range: 4.0
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.40
        always_send_full_costmap: True

  planner_server:
    ros__parameters:
      use_sim_time: True
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner/NavfnPlanner"
        tolerance: 0.5
        use_astar: True
        allow_unknown: True

  behavior_server:
    ros__parameters:
      use_sim_time: True
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "wait"]
      spin:
        plugin: "nav2_behaviors/Spin"
      backup:
        plugin: "nav2_behaviors/BackUp"
      wait:
        plugin: "nav2_behaviors/Wait"
      global_frame: robot1/odom
      robot_base_frame: robot1/base_link
      transform_tolerance: 0.1
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 3.2

  bt_navigator:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: robot1/base_link
      odom_topic: /robot1/odom
      transform_tolerance: 0.2
      default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

  velocity_smoother:
    ros__parameters:
      use_sim_time: True
      smoothing_frequency: 20.0
      scale_velocities: False
      feedback: "OPEN_LOOP"
      max_velocity: [0.22, 0.0, 1.0]
      min_velocity: [-0.26, 0.0, -1.0]
      max_accel: [2.5, 0.0, 3.2]
      max_decel: [-2.5, 0.0, -3.2]
      odom_topic: /robot1/odom
      odom_duration: 0.1
      deadband_velocity: [0.0, 0.0, 0.0]
      velocity_timeout: 1.0